[package]
name = "astral-auto-patcher"
version = "0.8.8"
edition = "2024"

[lib]
name = "astral_auto_patcher"
path = "src/lib.rs"

[[bin]]
name = "AstralAutoPatcher"
path = "src/main.rs"
required-features = ["terminal"]

[features]
default = ["terminal"]
terminal = ["dep:ratatui", "dep:crossterm"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
flate2 = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"], optional = true }
crossterm = { version = "0.29.0", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
