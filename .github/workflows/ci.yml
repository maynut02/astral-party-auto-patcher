name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 6.0.x
      - name: Build Windows plugin package
        shell: pwsh
        run: ./windows-plugin/scripts/build-package.ps1 -Version 0.0.0

  android-patcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-patcher
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.4.1"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest tests
